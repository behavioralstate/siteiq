<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteIQ — Report</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2334c77b'/%3E%3C/svg%3E">
</head>
<body>
  <script>
    /* Viewer report: legge ?job= e ?token= (o localStorage), carica e inietta. */
    "use strict";
    const params = new URLSearchParams(location.search);
    const job = params.get("job") || localStorage.getItem("siteiq_last_report");
    let token = params.get("token") || localStorage.getItem("siteiq_admin_token");

    if (!token) {
      token = prompt("Chiave di accesso admin:");
      if (token) localStorage.setItem("siteiq_admin_token", token);
    }

    async function load() {
      if (!job || !token) { document.body.innerHTML = "<h1>Report e token richiesti (?job=&token=)</h1>"; return; }
      try {
        const r = await fetch("/api/admin/report/" + encodeURIComponent(job), {
          headers: { "Authorization": "Bearer " + token },
        });
        if (r.status === 401) { document.body.innerHTML = "<h1>Chiave non valida</h1>"; return; }
        if (!r.ok) { document.body.innerHTML = "<h1>Report non trovato</h1>"; return; }
        const html = await r.text();
        document.open(); document.write(html); document.close();
      } catch (e) {
        document.body.innerHTML = "<h1>Errore: " + e.message + "</h1>";
      }
    }
    load();
  </script>
</body>
</html>
